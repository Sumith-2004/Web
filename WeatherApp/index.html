<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Weather App</h1>
        <div class="inner-nav">
            <div class="search-box">
                <input type="text" id="city" placeholder="Enter city">
                <button>Search</button>
            </div>
            <div class="city-temp">
                <span>Delhi</span>
                <span class="mini-circle"></span>
                <span>37°C</span>
            </div>
            <div class="city-temp">
                <span>Mumbai</span>
                <span class="mini-circle"></span>
                <span>32°C</span>
            </div>
        </div>
        <div class="record">
            <section class="record-info">
                <div class="location-info">
                    <div>
                        <h2>Chennai</h2>
                        <p>Tamil Nadu</p>
                    </div>
                </div>
                <div class="weather-info">
                    <div class="circle"></div>
                    <div class="temp-info">
                        <h1>34°C</h1>
                        <p>Sunny</p>
                    </div>
                </div>
                <div class="extra-info">
                    <div class="info-card">
                        <p>Humidity</p>
                        <h3>72%</h3>
                    </div>
                    <div class="info-card">
                        <p>Wind</p>
                        <h3>10 km/h</h3>
                    </div>
                    <div class="info-card">
                        <p>Feels Like</p>
                        <h3>36°C</h3>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
