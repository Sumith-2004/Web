<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link rel="stylesheet" href="./calc.css">
</head>
<body>

  <main class="container">
    <div id="disp" class="display">0</div>
    <div class="keyboard">
      <div class="left-side">

        <div id="one" class="btn">1</div>
        <div id="two" class="btn">2</div>
        <div id="three" class="btn">3</div>

        <div id="four" class="btn">4</div>
        <div id="five" class="btn">5</div>
        <div id="six" class="btn">6</div>

        <div id="seven" class="btn">7</div>
        <div id="eight" class="btn">8</div>
        <div id="nine" class="btn">9</div>

        <div id="zero" class="btn zero">0</div>
      </div>
      <div class="right-side">
        <div id="plus" class="btn op">+</div>
        <div id="minus" class="btn op">-</div>
        <div id="multiple" class="btn op">*</div>
        <div id="division" class="btn op">/</div>
        <div  id="equal" class="btn equal">=</div>
      </div>
    </div>
  </main>
  <script src="./main.js"></script>
</body>
</html>
