<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="container">
        <h1>ToDo</h1>
        <button id="addTaskBtn">+ Add Task</button>
        <div class="task-list">
            <div class="task">
                <div class="task-head">
                    <h4 class="task-title">Task 1</h4>
                    <p class="sub-title">Sub</p>
                </div>
                <div class="task-body">
                    <p>Lorem ipsum dolor sit amet.</p>
                </div>
            </div>
        </div>
    </main>
    <div id="createModal" class="modal hidden">
        <div class="modal-content">
            <h2>Create Task</h2>

            <input type="text" id="createTitle" placeholder="Title">
            <input type="text" id="createSubtitle" placeholder="Subtitle">
            <textarea id="createDesc" placeholder="Description"></textarea>

            <button id="saveTaskBtn">Save</button>
            <button id="closeCreateModal">Close</button>
        </div>
    </div>
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <h2>Edit Task</h2>

            <input type="text" id="editTitle">
            <input type="text" id="editSubtitle">
            <textarea id="editDesc"></textarea>

            <button id="updateTaskBtn">Update</button>
            <button id="closeEditModal">Close</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
