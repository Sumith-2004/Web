<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce</title>
    <link rel="stylesheet" href="./output.css" />
</head>

<body class="bg-gray-100">
    <nav class="h-[70px] w-full flex items-center justify-between px-8 bg-black text-white shadow-md">
        <div>
            <h1 class="text-2xl font-bold  cursor-pointer">LOGO</h1>
        </div>
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-2">
                <input type="search" placeholder="Search products..."
                    class="border border-gray-300 rounded-xl h-10 px-4 outline-none" />
                <button class="bg-fuchsia-500 hover:bg-fuchsia-900 text-white px-4 py-2 rounded-xl cursor-pointer transition">Search</button>
            </div>
            <a href="./store.html" class="hover:text-fuchsia-500 transition">Store</a>
            <a href="./support.html" class="hover:text-fuchsia-500 transition">Customer Support</a>
            <a href="#" class="hover:text-fuchsia-500 transition">Cart</a>
        </div>
    </nav>
    <main>
        <section class="min-h-[85vh] flex flex-col md:flex-row items-center justify-between px-10 py-16 bg-gradient-to-r from-fuchsia-500 to-indigo-600">
            <article class="max-w-xl">
                <span class="bg-white text-black p-2 rounded-full text-sm">BIG SALE 2026</span>
                <h1 class="text-5xl font-extrabold leading-tight text-white">Bulk Sale Is <br />Available Now</h1>
                <p class="text-lg text-blue-100 text-white">
                    Purchase your favorite products before the offer ends.
                    Get exclusive discounts on trending items.
                </p>
                <div class="flex gap-4">
                    <button class="bg-white  px-6 py-3 rounded-xl hover:scale-105 transition">Shop Now</button>
                    <button class="border border-white px-6 py-3 rounded-xl hover:bg-white hover:text-fuchsia-600 transition duration-300">Explore</button>
                </div>
            </article>
            <article>
                <img src="https://img.freepik.com/premium-psd/big-sale-discount-banner-template-promotion_501916-296.jpg?w=2000"
                    alt="Sale Banner"
                    class="w-[500px] rounded-3xl shadow-2xl hover:scale-105 transition duration-400" />
            </article>
        </section>
    </main>
    <footer class="h-[40px] w-[100%] bg-black flex justify-center ">
        <p class="text-gray-100 ">
            C All Rights Reserved by Store
        </p>
    </footer>
</body>

</html>
