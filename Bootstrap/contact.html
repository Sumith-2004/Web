<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark d-flex justify-content-around">
        <a href="./index.html" class="navbar-brand">Home</a>
        <a href="./about.html" class="navbar-brand">About</a>
        <a href="./contact.html" class="navbar-brand">Contact</a>
    </nav>
    <main class="container">
        <div class="row  bg-white p-4">
            <div class="col-md-5 border-end">
                <h2 class="mb-4">Contact Us</h2>

                <p><b>Email:</b> artigo@gmail.com</p>
                <p><b>Instagram:</b> @artigo</p>
                <p><b>Facebook:</b> facebook.com/artigo</p>
                <p><b>Telephone:</b> +91 9876543210</p>
            </div>

            <div class="col-7 mt-4 ">
                <h3 class="mb-4">Send Message</h3>

                <form>

                    <div class="mb-3">
                        <label class="form-label">Your Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter your phone number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4"
                            placeholder="Write your message"></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark">
                        Submit
                    </button>

                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
